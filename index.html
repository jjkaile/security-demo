<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Daily Log — Trinity Security</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(140px + env(safe-area-inset-bottom));
  }

  /* === Top bar === */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(248, 248, 250, 0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid #c6c6c8;
    padding: 12px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .topbar .logo {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    color: #5b9bd5;
  }
  .topbar .logo svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .topbar .titles {
    text-align: left;
    min-width: 0;
  }
  .topbar h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    color: #1a2b5e;
    letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .topbar h2 {
    margin: 2px 0 0;
    font-size: 17px;
    font-weight: 700;
    color: #000;
    line-height: 1.2;
  }

  /* === Section grouping (iOS settings style) === */
  .section {
    margin: 22px 16px 8px;
    font-size: 13px;
    font-weight: 400;
    color: #6c6c70;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding-left: 4px;
  }
  .group {
    background: white;
    margin: 0 16px;
    border-radius: 10px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 11px 16px;
    border-bottom: 0.5px solid #e5e5ea;
    min-height: 44px;
  }
  .row:last-child { border-bottom: none; }
  .row label {
    font-size: 17px;
    color: #1c1c1e;
    flex-shrink: 0;
    min-width: 90px;
  }
  .row input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 17px;
    font-family: inherit;
    text-align: right;
    color: #3c3c43;
    padding: 4px 0;
    min-width: 0;
  }
  .row input:focus { outline: none; color: #000; }
  .row input::placeholder { color: #c7c7cc; }

  /* === Log entry cards === */
  .entries { padding: 0 16px; }
  .entry-card {
    background: white;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    position: relative;
  }
  .entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .entry-time-display {
    font-size: 15px;
    font-weight: 600;
    color: #1a2b5e;
    background: #eef0f8;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }
  .entry-delete {
    background: none;
    border: none;
    color: #ff3b30;
    font-size: 22px;
    padding: 4px 8px;
    cursor: pointer;
    line-height: 1;
  }
  .entry-text {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 16px;
    font-family: inherit;
    color: #1c1c1e;
    resize: none;
    padding: 0;
    min-height: 44px;
    line-height: 1.4;
  }
  .entry-text:focus { outline: none; }
  .entry-text::placeholder { color: #c7c7cc; }

  .empty-state {
    text-align: center;
    color: #8e8e93;
    padding: 28px 20px;
    font-size: 15px;
  }

  /* === Floating Add button === */
  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(100px + env(safe-area-inset-bottom));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #1a2b5e;
    color: white;
    border: none;
    font-size: 30px;
    font-weight: 300;
    box-shadow: 0 4px 16px rgba(26,43,94,0.35);
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding-bottom: 4px;
  }
  .fab:active { transform: scale(0.95); }

  /* === Bottom send bar === */
  .sendbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(248, 248, 250, 0.95);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid #c6c6c8;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 15;
  }
  .send-btn {
    width: 100%;
    padding: 14px;
    background: #1a2b5e;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .send-btn:active { background: #2a3b7e; }
  .recipients {
    font-size: 11px;
    color: #8e8e93;
    text-align: center;
    margin-top: 6px;
  }

  /* === Action sheet (time picker modal) === */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .sheet-modal {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #f2f2f7;
    border-radius: 16px 16px 0 0;
    z-index: 101;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  }
  .sheet-modal.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px;
    height: 5px;
    background: #c7c7cc;
    border-radius: 3px;
    margin: 8px auto 4px;
  }
  .sheet-header {
    text-align: center;
    padding: 14px 20px 4px;
  }
  .sheet-header h3 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    color: #000;
  }
  .sheet-header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #6c6c70;
  }
  .sheet-time-wrap {
    padding: 16px 20px 8px;
    text-align: center;
  }
  .sheet-time-input {
    font-size: 44px;
    font-weight: 300;
    border: none;
    background: transparent;
    text-align: center;
    color: #1a2b5e;
    font-family: inherit;
    padding: 12px;
    width: 100%;
    -webkit-appearance: none;
  }
  .sheet-time-input:focus { outline: none; }
  .sheet-actions {
    display: flex;
    gap: 10px;
    padding: 8px 16px 0;
  }
  .sheet-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-family: inherit;
    cursor: pointer;
  }
  .sheet-btn-cancel {
    background: #e5e5ea;
    color: #1c1c1e;
    font-weight: 500;
  }
  .sheet-btn-confirm {
    background: #1a2b5e;
    color: white;
    font-weight: 600;
  }
  .sheet-btn-confirm:active { background: #2a3b7e; }
</style>
</head>

  <div class="titles">
    <h1>TRINITY INVESTIGATIONS &amp; SECURITY</h1>
    <h2>Daily Log</h2>
  </div>
</div>

<div class="section">Shift Info</div>
<div class="group">
  <div class="row">
    <label>Officer</label>
    <input type="text" id="dutyOfficer" placeholder="Name" autocomplete="off">
  </div>
  <div class="row">
    <label>Location</label>
    <input type="text" id="location" placeholder="Post / site" autocomplete="off">
  </div>
  <div class="row">
    <label>Date</label>
    <input type="date" id="date">
  </div>
  <div class="row">
    <label>Start</label>
    <input type="time" id="startTime">
  </div>
  <div class="row">
    <label>End</label>
    <input type="time" id="endTime">
  </div>
</div>

<div class="section">Log Entries</div>
<div class="entries" id="entries">
  <div class="empty-state" id="emptyState">Tap + to add your first entry</div>
</div>

<div class="section">Signature</div>
<div class="group">
  <div class="row">
    <label>Sign</label>
    <input type="text" id="signature" placeholder="Type full name" autocomplete="off">
  </div>
</div>

<button class="fab" id="fabBtn" aria-label="Add entry">+</button>

<!-- Action sheet for picking entry time -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet-modal" id="sheetModal" role="dialog" aria-labelledby="sheetTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <h3 id="sheetTitle">New Log Entry</h3>
    <p>What time did this happen?</p>
  </div>
  <div class="sheet-time-wrap">
    <input type="time" id="sheetTimeInput" class="sheet-time-input">
  </div>
  <div class="sheet-actions">
    <button class="sheet-btn sheet-btn-cancel" id="sheetCancelBtn">Cancel</button>
    <button class="sheet-btn sheet-btn-confirm" id="sheetConfirmBtn">Add Entry</button>
  </div>
</div>

<div class="sendbar">
  <button class="send-btn" id="sendBtn">Send Log</button>
  <div class="recipients" id="recipientPreview"></div>
</div>

<script>
  // ===== CONFIGURE RECIPIENTS HERE =====
  const RECIPIENTS = [
    "josephmailbox2@gmail.com",
    "josephmailbox2@icloud.com"
  ];
  // =====================================

  document.getElementById('recipientPreview').textContent = 'Sends to: ' + RECIPIENTS.join(', ');
  document.getElementById('date').valueAsDate = new Date();

  function currentTimeStr() {
    const d = new Date();
    return d.toTimeString().slice(0,5);
  }

  function formatTimeDisplay(t24) {
    if (!t24) return '--:--';
    const [h, m] = t24.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${String(m).padStart(2,'0')} ${period}`;
  }

  // === Action sheet flow ===
  function openTimeSheet() {
    document.getElementById('sheetTimeInput').value = currentTimeStr();
    document.getElementById('sheetBackdrop').classList.add('open');
    document.getElementById('sheetModal').classList.add('open');
  }

  function closeTimeSheet() {
    document.getElementById('sheetBackdrop').classList.remove('open');
    document.getElementById('sheetModal').classList.remove('open');
  }

  function confirmTime() {
    const t = document.getElementById('sheetTimeInput').value || currentTimeStr();
    closeTimeSheet();
    addEntry(t);
  }

  function addEntry(time, text = '') {
    const container = document.getElementById('entries');
    document.getElementById('emptyState')?.remove();

    const card = document.createElement('div');
    card.className = 'entry-card';
    card.dataset.time = time;
    card.innerHTML = `
      <div class="entry-head">
        <span class="entry-time-display">${formatTimeDisplay(time)}</span>
        <button class="entry-delete" aria-label="Delete">×</button>
      </div>
      <textarea class="entry-text" placeholder="What happened?" rows="2">${text}</textarea>
    `;
    container.appendChild(card);

    card.querySelector('.entry-delete').addEventListener('click', () => deleteEntry(card));

    const ta = card.querySelector('.entry-text');
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
    ta.focus();
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function deleteEntry(card) {
    card.remove();
    if (!document.querySelector('.entry-card')) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.id = 'emptyState';
      empty.textContent = 'Tap + to add your first entry';
      document.getElementById('entries').appendChild(empty);
    }
  }

  function getEntries() {
    return [...document.querySelectorAll('.entry-card')].map(c => ({
      time: c.dataset.time || '',
      text: c.querySelector('.entry-text').value.trim()
    })).filter(e => e.time || e.text);
  }

  function sendEmail() {
    const officer = document.getElementById('dutyOfficer').value.trim();
    const location = document.getElementById('location').value.trim();
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const date = document.getElementById('date').value;
    const signature = document.getElementById('signature').value.trim();
    const entries = getEntries();

    if (!officer || !signature) {
      alert('Officer name and signature are required.');
      return;
    }

    let body = `TRINITY INVESTIGATIONS & SECURITY INC.\nDaily Security Officer Log\n`;
    body += `${'='.repeat(40)}\n\n`;
    body += `Officer:  ${officer}\n`;
    body += `Location: ${location}\n`;
    body += `Date:     ${date}\n`;
    body += `Shift:    ${startTime} – ${endTime}\n\n`;
    body += `LOG ENTRIES\n${'-'.repeat(40)}\n`;

    if (entries.length === 0) {
      body += `(no entries)\n`;
    } else {
      entries.forEach(e => {
        body += `\n[${e.time || '--:--'}]\n${e.text}\n`;
      });
    }
    body += `\n${'-'.repeat(40)}\n`;
    body += `Signed: ${signature}\n`;

    const subject = `Daily Security Log — ${officer} — ${date}`;
    const mailto = `mailto:${RECIPIENTS.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    // Use an anchor click instead of window.location — works reliably on iPad Safari
    const a = document.createElement('a');
    a.href = mailto;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 100);
  }

  // === Wire up event listeners (works more reliably than inline onclick on iPad Safari) ===
  document.getElementById('fabBtn').addEventListener('click', openTimeSheet);
  document.getElementById('sheetBackdrop').addEventListener('click', closeTimeSheet);
  document.getElementById('sheetCancelBtn').addEventListener('click', closeTimeSheet);
  document.getElementById('sheetConfirmBtn').addEventListener('click', confirmTime);
  document.getElementById('sendBtn').addEventListener('click', sendEmail);
</script>
</body>
</html>
